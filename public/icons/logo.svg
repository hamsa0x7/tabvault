<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="tabvault-logo-title tabvault-logo-desc">
  <title id="tabvault-logo-title">TabVault Logo</title>
  <desc id="tabvault-logo-desc">Two overlapping architectural browser tab planes with a precision vault keyhole</desc>
  <defs>
    <style>
      .tv-back { fill: #64748B; }
      .tv-front { fill: #0B87C9; }
      @media (prefers-color-scheme: dark) {
        .tv-back { fill: #94A3B8; }
        .tv-front { fill: #38BDF8; }
      }
    </style>
    <mask id="tv-back-cutout">
      <rect width="128" height="128" fill="#FFFFFF" />
      <path d="M10 30 H58 C62.4 30 66 33.6 66 38 V46 H118 V118 H10 Z" fill="#000000" />
    </mask>
    <mask id="tv-front-keyhole">
      <rect width="128" height="128" fill="#FFFFFF" />
      <circle cx="60" cy="75" r="9" fill="#000000" />
      <path d="M55 80 H65 V94 A5 5 0 0 1 55 94 Z" fill="#000000" />
    </mask>
  </defs>

  <!-- Back browser tab plane -->
  <path
    class="tv-back"
    mask="url(#tv-back-cutout)"
    d="M40 16 H76 C80.4 16 84 19.6 84 24 V28 H104 C108.4 28 112 31.6 112 36 V84 C112 88.4 108.4 92 104 92 H40 C35.6 92 32 88.4 32 84 V24 C32 19.6 35.6 16 40 16 Z"
  />

  <!-- Front vault tab plane with clean masked keyhole -->
  <path
    class="tv-front"
    mask="url(#tv-front-keyhole)"
    d="M24 36 H52 C56.4 36 60 39.6 60 44 V52 H96 C100.4 52 104 55.6 104 60 V104 C104 108.4 100.4 112 96 112 H24 C19.6 112 16 108.4 16 104 V44 C16 39.6 19.6 36 24 36 Z"
  />
</svg>
