name = "tabvault-oauth"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
GITHUB_REPO = "hamsa0x7/tabvault"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
